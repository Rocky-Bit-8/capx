# Molmo runs on the remote GPU server and is exposed locally through an SSH tunnel.
# Terminal 1 (keep running):
#   ssh -N -L 8122:127.0.0.1:8122 -p 47322 root@connect.westb.seetacloud.com
# Terminal 2 (on the remote server, after the tunnel is established):
#   /root/autodl-tmp/start_molmo_vllm.sh
# Verify locally before launching:
#   curl -fsS http://127.0.0.1:8122/v1/models
# Usage: uv run capx/envs/launch.py --config-path env_configs/cube_stack/franka_robosuite_cube_stack_multiturn_molmo.yaml

env:
  _target_: capx.envs.tasks.franka.franka_pick_place.FrankaPickPlaceCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_low_level
    privileged: false
    apis:
      - FrankaControlMolmoApi
    prompt: |
      You are controlling a Franka Emika robot with API described below.
      Goal: place the red cube on top of the green cube, open the gripper, and finally return the robot arm to its initial home configuration. Use z_approach=0.150 for every grasp and placement descent. Returning home is required: call home_pose() after releasing the cube, and do not finish until it has completed. Molmo is available through point_prompt_molmo(text_prompt) when a point prompt is useful; it returns pixel coordinates and does not replace SAM3 or Contact-GraspNet.
      You may write python code comments for reasoning but ONLY write the executable Python code and do not write it in code fences.
      After this code executes, you will be able to get a new observation of the environment and write new code to complete the task if needed.
      The functions (APIs) below are already imported to the environment. If you want to use numpy, you need to import it explicitly.
    
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      If there were no errors during compilation or execution, the console stderr will be empty. If there were errors, consider regenerating the code.
      Please respond with EXACTLY ONE of the following:
      - The word 'REGENERATE' followed immediately by new Python code in a fenced code block (```python...```) if you want to modify the code.
      - The word 'FINISH' ONLY when the current observation and execution output confirm all of the following: the red cube is stably supported on top of the green cube (not held, falling, or merely adjacent), the gripper has been opened after placement, and home_pose() completed successfully. If any condition is unverified, ambiguous, or an API call failed, respond with REGENERATE and add verification or corrective code. A successful code execution alone is not sufficient to FINISH.

api_servers:
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1
    checkpoint_path: /home/rocky/Code/cap-x-main/sam3_repacked.pt

  # The generated visual policy commonly calls sample_grasp_pose(), which
  # requires this local Contact-GraspNet endpoint.
  - _target_: capx.serving.launch_contact_graspnet_server.main
    device: cuda
    port: 8115
    host: 127.0.0.1

record_video: true
use_img_differencing: true
output_dir: ./outputs/franka_robosuite_cube_stack_multiturn_molmo
use_legacy_multi_turn_decision_prompt: true

trials: 100
num_workers: 12
