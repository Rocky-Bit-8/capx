# Molmo runs remotely. Start it and open an SSH tunnel before launching:
#   ssh -p 47322 root@connect.westb.seetacloud.com '/root/autodl-tmp/start_molmo_vllm.sh'
#   ssh -N -o ExitOnForwardFailure=yes -L 8122:127.0.0.1:8122 -p 47322 root@connect.westb.seetacloud.com
#   curl -fsS http://127.0.0.1:8122/v1/models

env:
  _target_: capx.envs.tasks.franka.franka_nut_assembly.FrankaNutAssemblyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_nut_assembly_low_level_visual
    privileged: true
    apis:
      - FrankaControlNutAssemblyMolmoApi
    prompt: |
      You control a Franka robot. Insert the brown square nut onto the brown square block.
      Use sample_grasp_pose('extruded handle of the brown square nut') for grasping and
      get_object_pose('white hollow center of the brown square nut') for placement.
      Molmo is used only to improve the handle pixel; SAM3 and depth produce the 3D pose.
      Write only executable Python code. Import numpy or scipy explicitly when needed.
    multi_turn_prompt: |
      The following code blocks were just executed:
      ```python
      {executed_code}
      ```
      The current console stdout is:
      ```
      {console_stdout}
      ```
      The current console stderr is:
      ```
      {console_stderr}
      ```
      Respond with exactly REGENERATE followed by a Python code block, or FINISH when the
      nut is inserted and the task is verified complete.

api_servers:
  - _target_: capx.serving.launch_pyroki_server.main
    port: 8116
    host: 127.0.0.1
    robot: panda_description
    target_link: panda_hand
  - _target_: capx.serving.launch_sam3_server.main
    device: cuda
    port: 8114
    host: 127.0.0.1

record_video: true
output_dir: ./outputs/franka_robosuite_nut_assembly_multiturn_molmo
use_img_differencing: true
use_legacy_multi_turn_decision_prompt: true
trials: 100
num_workers: 12
